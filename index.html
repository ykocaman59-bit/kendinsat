<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultanbeyli Haber & Yaşam Platformu</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ÜST MENÜ -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-tower-broadcast"></i> <span>Sultanbeyli Sende</span>
        </div>
        <div class="user-menu" id="userMenuSection">
            <!-- Giriş yapılmamışsa -->
            <button id="loginBtn" class="btn-primary"><i class="fa-brands fa-google"></i> Gmail ile Giriş Yap</button>
            <!-- Giriş yapılmışsa burası JS ile dolacak -->
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="container">
        
        <!-- HABER / DURUM PAYLAŞMA KUTUSU -->
        <section class="share-box" id="shareBox" style="display: none;">
            <h3><i class="fa-solid fa-pen-to-square"></i> Ne Oluyor Sultanbeyli'de?</h3>
            <textarea id="postContent" placeholder="Deprem mi oldu? Yol mu kapandı? Haber ver, komşuların bilsin..."></textarea>
            
            <div class="share-options">
                <label>
                    <input type="checkbox" id="isPoll"> Anket Ekle (Örn: Hissettiniz mi?)
                </label>
                <button id="submitPostBtn" class="btn-success">Paylaş</button>
            </div>
        </section>

        <!-- AKIŞ (HABERLER VE ANKETLER) -->
        <section class="feed-section">
            <h2><i class="fa-solid fa-bolt"></i> Son Akış & Haberler</h2>
            <div id="postsContainer">
                <!-- Gönderiler dinamik yüklenecek -->
            </div>
        </section>

    </main>

    <!-- PROFİL / HESAP YÖNETİM MODALI -->
    <div id="profileModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" id="closeProfileModal">&times;</span>
            <h2><i class="fa-solid fa-user-gear"></i> Profil Bilgileri</h2>
            
            <div class="profile-info-group">
                <img id="modalUserPhoto" src="" alt="Profil Resmi" class="profile-avatar">
                <p id="modalUserEmail" class="text-muted"></p>
            </div>

            <div class="form-group">
                <label>Kullanıcı Adı / İsim:</label>
                <input type="text" id="modalUserName" class="form-control">
            </div>

            <div class="modal-actions">
                <button id="saveProfileBtn" class="btn-primary">Bilgileri Güncelle</button>
                <button id="logoutBtn" class="btn-warning">Çıkış Yap</button>
                <hr>
                <button id="deleteAccountBtn" class="btn-danger">Gmail / Hesabı Sistemden Sil</button>
            </div>
        </div>
    </div>

    <!-- Firebase Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
