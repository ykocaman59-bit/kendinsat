<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sahibinden.com - Satılık, Kiralık, Emlak, Araç ve Her Şey</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK'ları -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    <!-- Üst Banner / Header -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <h1 class="logo">sahibinden<span class="com">.com</span></h1>
                <span class="pro-slogan">Pro Max</span>
            </div>
            <div class="search-bar-header">
                <input type="text" id="searchInput" placeholder="Kelime, ilan no. veya mağaza adı ile ara">
                <button id="searchBtn">Ara</button>
            </div>
            <div class="user-actions">
                <div id="authArea">
                    <button id="googleLoginBtn" class="login-btn">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18"> 
                        Google ile Giriş Yap
                    </button>
                </div>
                <div id="userProfile" style="display: none;" class="profile-area">
                    <span id="userName">Kullanıcı</span>
                    <button id="logoutBtn" class="logout-btn">Çıkış</button>
                </div>
                <button class="free-ad-btn">+ Ücretsiz İlan Ver</button>
            </div>
        </div>
    </header>

    <!-- Ana İçerik ve Filtreleme Alanı -->
    <div class="main-content">
        <aside class="filter-sidebar">
            <h3>Filtreler</h3>
            <div class="filter-group">
                <label>KATEGORİ</label>
                <select id="categoryFilter">
                    <option value="all">Tüm Kategoriler</option>
                    <option value="emlak">Emlak</option>
                    <option value="vasita">Vasıta</option>
                </select>
            </div>
            <div class="filter-group">
                <label>FİYAT ARALIĞI (TL)</label>
                <div class="price-inputs">
                    <input type="number" id="minPrice" placeholder="Min">
                    <input type="number" id="maxPrice" placeholder="Max">
                </div>
            </div>
            <button id="applyFilterBtn" class="filter-apply-btn">Filtreleri Uygula</button>
        </aside>

        <section class="listings-section">
            <div class="listings-header">
                <span id="listingCount">2 İlan Listeleniyor</span>
                <select id="sortSelect">
                    <option value="newest">En Yeni İlan</option>
                    <option value="price-asc">Fiyata Göre (Önce En Düşük)</option>
                    <option value="price-desc">Fiyata Göre (Önce En Yüksek)</option>
                </select>
            </div>

            <div id="listingsContainer" class="listings-list">
                <!-- Örnek İlan 1 -->
                <div class="listing-item" data-category="vasita" data-price="980000">
                    <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=300&q=80" alt="Araç">
                    <div class="listing-details">
                        <h4>Hatasız Boyasız Aile Aracı - Otomatik Vites</h4>
                        <p class="listing-specs">2021 • 45.000 km • Benzin/LPG</p>
                        <p class="listing-location">Ankara / Çankaya</p>
                    </div>
                    <div class="listing-price">
                        <span>980.000 TL</span>
                    </div>
                </div>

                <!-- Örnek İlan 2 -->
                <div class="listing-item" data-category="emlak" data-price="3450000">
                    <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=300&q=80" alt="Konut">
                    <div class="listing-details">
                        <h4>Merkezi Konumda Ara Kat 3+1 Satılık Daire</h4>
                        <p class="listing-specs">3+1 • 135 m² • 5. Kat</p>
                        <p class="listing-location">İstanbul / Sultanbeyli</p>
                    </div>
                    <div class="listing-price">
                        <span>3.450.000 TL</span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
